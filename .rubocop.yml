plugins:
  - rubocop-performance
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# Metrics limits are ratcheted to the current worst case so complexity can't grow.
# Lower them as methods are simplified.
Metrics/AbcSize:
  Max: 33

Metrics/BlockLength:
  Exclude:
    - spec/**/*

Metrics/ClassLength:
  Max: 165

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 28

Metrics/PerceivedComplexity:
  Max: 17
